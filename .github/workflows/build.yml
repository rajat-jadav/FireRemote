name: Build APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build both debug APKs
        run: gradle :tvreceiver:assembleDebug :phonecontroller:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FireRemote-APKs
          path: |
            tvreceiver/build/outputs/apk/debug/tvreceiver-debug.apk
            phonecontroller/build/outputs/apk/debug/phonecontroller-debug.apk
